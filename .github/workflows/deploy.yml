name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Frontmatter lint — duplicate keys, required fields, valid enums
      - name: Lint frontmatter
        run: pnpm lint:content

      # Code lint + format check (Biome)
      - name: Lint code
        run: pnpm lint

      # TypeScript + Astro component typecheck
      - name: Typecheck
        run: pnpm typecheck

      # Build
      - run: pnpm build

      # CF Pages 301-redirects /404→/404/ but has no 404/index.html, causing a loop.
      # Providing both files lets CF serve /404/ directly.
      - run: mkdir -p dist/404 && cp dist/404.html dist/404/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        if: hashFiles('functions/') != ''
        with:
          name: functions
          path: functions/

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: functions
          path: functions/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=superdots-blog

      - name: Smoke test
        continue-on-error: true
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 SuperdotsCI/1.0" https://superdots.sh)
          echo "Smoke test: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then echo "✅ Site is live"; fi
