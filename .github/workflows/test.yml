name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  # Accessibility tests run only on workflow_dispatch until the test suite stabilizes.
  # Enable on PRs by adding `pull_request: branches: [main]` above.
  a11y:
    name: Accessibility (pa11y-ci)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm preview --host 0.0.0.0 --port 4321 &
          for i in {1..20}; do
            if curl -sf http://localhost:4321/ > /dev/null; then
              echo "Preview server ready"
              break
            fi
            sleep 1
          done

      - name: Run pa11y-ci
        run: pnpm test:a11y
