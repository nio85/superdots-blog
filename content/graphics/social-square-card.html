<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sd-red:       #E8363B;
    --sd-teal:      #14B8A6;
    --sd-amber:     #F59E0B;
    --sd-purple:    #6366F1;
    --sd-navy:      #0B1222;
    --sd-navy-mid:  #111827;
    --sd-navy-light:#1E293B;
    --sd-gray-400:  #94A3B8;
    --sd-gray-200:  #E2E8F0;
    --sd-white:     #FFFFFF;
    --accent:       var(--sd-red); /* overridden inline by department */
  }

  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--sd-navy);
    color: var(--sd-white);
    overflow: hidden;
  }

  .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    position: relative;
    background:
      radial-gradient(ellipse 60% 50% at 10% 90%, rgba(232,54,59,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 90% 10%, rgba(20,184,166,0.10) 0%, transparent 65%),
      var(--sd-navy);
  }

  /* Top accent bar */
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 80px;
    right: 80px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    border-radius: 0 0 3px 3px;
  }

  /* ─── HEADER ─── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .wordmark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
    color: var(--sd-white);
  }

  .wordmark span { color: var(--accent); }

  .dept-badge {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--sd-gray-400);
  }

  /* ─── BODY ─── */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 32px;
    padding: 48px 0;
  }

  .label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
  }

  .hook {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: 62px;
    line-height: 1.08;
    letter-spacing: -0.03em;
    color: var(--sd-white);
    max-width: 900px;
  }

  .hook em {
    font-style: normal;
    color: var(--accent);
  }

  .subtext {
    font-size: 22px;
    line-height: 1.5;
    color: var(--sd-gray-400);
    max-width: 760px;
    font-weight: 400;
  }

  /* ─── FOOTER ─── */
  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .url {
    font-size: 18px;
    font-weight: 500;
    color: var(--sd-gray-400);
    letter-spacing: 0.01em;
  }

  .url span { color: var(--sd-white); }

  .cta {
    font-size: 15px;
    font-weight: 500;
    color: var(--sd-gray-400);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Corner accent dot grid */
  .dots {
    position: absolute;
    bottom: 72px;
    right: 80px;
    display: flex;
    gap: 8px;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.4;
  }
  .dots span:last-child { opacity: 1; }
</style>
</head>
<body style="--accent: {{accentColor}};">
  <div class="card">

    <div class="header">
      <div class="wordmark">superdots<span>.</span></div>
      <div class="dept-badge">{{department}}</div>
    </div>

    <div class="body">
      <div class="label">{{label}}</div>
      <h1 class="hook">{{hook}}</h1>
      <p class="subtext">{{subtext}}</p>
    </div>

    <div class="footer">
      <div class="url"><span>superdots.sh</span>/blog/{{slug}}</div>
      <div class="cta">Read more →</div>
    </div>

    <div class="dots">
      <span></span><span></span><span></span>
    </div>

  </div>
</body>
</html>
