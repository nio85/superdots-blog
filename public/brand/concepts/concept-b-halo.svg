<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept B: "Halo"
       A single bold circle with a radial gradient (red core → navy edge),
       surrounded by a thin arc (~270°) that doesn't fully close.
       The open arc creates visual tension and sophistication.
       Kandinsky: circle as cosmic form. Tschichold: precision geometry. -->
  <defs>
    <radialGradient id="halo-core" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#F04048"/>
      <stop offset="70%" stop-color="#E8363B"/>
      <stop offset="100%" stop-color="#8C1E22"/>
    </radialGradient>
    <linearGradient id="halo-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8363B"/>
      <stop offset="100%" stop-color="#1A2744"/>
    </linearGradient>
  </defs>
  <!-- Arc: 270° ring, open at bottom-left -->
  <path d="M 12.34 43.66 A 24 24 0 1 1 20.34 51.66" stroke="url(#halo-ring)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Core circle -->
  <circle cx="32" cy="32" r="16" fill="url(#halo-core)"/>
</svg>
