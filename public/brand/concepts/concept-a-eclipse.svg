<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept A: "Eclipse"
       Two overlapping circles with gradient fills.
       A large circle anchors the composition; a smaller circle
       overlaps upper-right, creating depth through color interaction.
       Kandinsky: geometric tension between two forms.
       Neue Typographie: clean, structured, asymmetric balance. -->
  <defs>
    <linearGradient id="eclipse-lg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C42D31"/>
      <stop offset="100%" stop-color="#E8363B"/>
    </linearGradient>
    <linearGradient id="eclipse-sm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8363B"/>
      <stop offset="60%" stop-color="#A02028"/>
      <stop offset="100%" stop-color="#0B1222"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="38" r="22" fill="url(#eclipse-lg)"/>
  <circle cx="44" cy="20" r="14" fill="url(#eclipse-sm)"/>
</svg>
